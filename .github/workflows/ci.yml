name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore XCGF.Arena.slnx
      - run: dotnet build XCGF.Arena.slnx --no-restore -c Release
      - run: dotnet test XCGF.Arena.slnx --no-build -c Release
